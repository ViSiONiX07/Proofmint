<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" fill="none">
  <!-- Proofmint Primary Dark Logo (Mint symbol, Off-white wordmark) -->
  <g transform="translate(180, 115)">
    <!-- Symbol: Geometric P with integrated checkmark in Mint (#A7F3D0) -->
    <g transform="translate(0, 0)">
      <!-- Outer P frame -->
      <path d="M 50,230 L 50,40 L 190,40 C 228,40 250,62 250,105 C 250,148 228,170 190,170 L 130,170" 
            stroke="#A7F3D0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner Checkmark passing through stem -->
      <path d="M 30,135 L 95,200 L 225,65" 
            stroke="#A7F3D0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wordmark: "proofmint" in Off-white (#F5F5F0) -->
    <text x="320" y="180" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Hanken Grotesk', 'Segoe UI', Roboto, sans-serif" 
          font-size="142" 
          font-weight="700" 
          letter-spacing="-0.04em" 
          fill="#F5F5F0">proofmint</text>
  </g>
</svg>
